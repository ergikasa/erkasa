# Shared configuration for every profile.
# Secrets are never written here: they come from environment variables
# (locally from infra/.env, see application-dev.yml).

spring:
  application:
    name: erkasa-backend

  profiles:
    # Locally you run with "dev" automatically. On the server set SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    # Locally: Mailpit from docker compose (catches all mail, UI at http://localhost:8025).
    # Production: a real SMTP provider; username/password are set in application-prod.yml.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    # Adds the request ID next to the log level on every line: INFO [3f2a...] ...
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
  health:
    mail:
      # A slow or down mail server must not mark the whole app as DOWN; email is sent in the background.
      enabled: false

# Our own settings.
erkasa:
  app:
    # Where the React app lives. Links in emails point here (e.g. /verify-email?token=...).
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:erkasa <no-reply@erkasa.local>}

  jwt:
    # Base64, at least 32 bytes. Locally from infra/.env, in production from the server.
    secret: ${JWT_SECRET}
    issuer: erkasa
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  google:
    # OAuth Client ID from Google Cloud Console. Empty = Google login returns 503.
    client-id: ${GOOGLE_CLIENT_ID:}

  rate-limit:
    enabled: true
    # Locally there is no proxy. In production (behind nginx/Cloudflare) this is true, see application-prod.yml.
    trust-proxy: false
    # Per IP address. Keep "login" first: RateLimitTests overrides rules[0].
    rules:
      - { name: login,               method: POST, path: /api/auth/login,               limit: 10, window: 5m }
      - { name: register,            method: POST, path: /api/auth/register,            limit: 5,  window: 1h }
      - { name: google,              method: POST, path: /api/auth/google,              limit: 20, window: 5m }
      - { name: refresh,             method: POST, path: /api/auth/refresh,             limit: 60, window: 5m }
      - { name: forgot-password,     method: POST, path: /api/auth/forgot-password,     limit: 5,  window: 1h }
      - { name: reset-password,      method: POST, path: /api/auth/reset-password,      limit: 10, window: 1h }
      - { name: verify-email,        method: POST, path: /api/auth/verify-email,        limit: 20, window: 1h }
      - { name: resend-verification, method: POST, path: /api/auth/resend-verification, limit: 5,  window: 1h }

  cors:
    # Websites allowed to call the API from a browser. Comma-separated for several.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: true