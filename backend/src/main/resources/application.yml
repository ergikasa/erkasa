# Shared configuration for every profile.
# Secrets are never written here: they come from environment variables
# (locally from infra/.env, see application-dev.yml).

spring:
  application:
    name: erkasa-backend

  profiles:
    # Locally you run with "dev" automatically. On the server set SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    # Adds the request ID next to the log level on every line: INFO [3f2a...] ...
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always

# Our own settings.
erkasa:
  jwt:
    # Base64, at least 32 bytes. Locally from infra/.env, in production from the server.
    secret: ${JWT_SECRET}
    issuer: erkasa
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: true