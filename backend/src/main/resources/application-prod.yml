# Production. Every secret comes from server environment variables.

spring:
  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  endpoint:
    health:
      # Do not expose internal details publicly.
      show-details: never

erkasa:
  rate-limit:
    # In production the backend sits behind a reverse proxy that sets X-Forwarded-For.
    trust-proxy: true

  storage:
    # Cloudflare R2 endpoint, e.g. https://<account-id>.r2.cloudflarestorage.com
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:auto}

logging:
  structured:
    format:
      # One JSON line per log entry, easy to search in log tools.
      console: ecs
  level:
    root: INFO
    com.erkasa: INFO